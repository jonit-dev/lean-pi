name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 11 and Node 22 in one step, from `packageManager` in package.json.
      # The suite needs no credential, no subscription and no network.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      # The suite execs `bin/leanpi.js` and calls `launchPlan`, both of which
      # resolve `dist/` — so the gates need the build, not just the sources.
      - run: pnpm build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
