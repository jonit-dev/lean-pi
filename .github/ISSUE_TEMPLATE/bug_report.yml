name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here — see
        [SECURITY.md](https://github.com/jonit-dev/lean-pi/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: |
        The smallest steps that show it. Include the command, the backend or
        provider, and the task you gave it.
      placeholder: |
        1. leanpi
        2. /route ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error and the footer line, verbatim. Redact keys.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0, or git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: "v22.22.0 on Linux x64"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Anything unusual about the configuration
      description: |
        `leanpi.config.yaml` with keys redacted, plus the permission scopes or
        `--safety` level in force. Say so if a backend is a local or
        OpenAI-compatible endpoint rather than a vendor CLI.
    validations:
      required: false
