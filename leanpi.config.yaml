backends:
  opencode-go:
    type: native
    baseUrl: https://opencode.ai/zen/go/v1
    api: openai-completions
    apiKey: OPENCODE_API_KEY
    reasoning: true
    compat:
      thinkingFormat: deepseek
    headers:
      x-opencode-session: LEANPI_OPENCODE_SESSION
    contextWindow: 1000000
    maxTokens: 32000
    cost:
      input: 0.15
      output: 0.6
      cacheRead: 0.003
  codex:
    type: external_harness
models:
  quick:
    backend: opencode-go
    model: deepseek-v4.1-flash
  balanced:
    backend: opencode-go
    model: deepseek-v4.1-flash
  strong:
    backend: opencode-go
    model: deepseek-v4.1-flash
  specialist:
    backend: codex
    model: gpt-6-astra
  review_quick:
    backend: opencode-go
    model: deepseek-v4.1-flash
  review_strong:
    backend: opencode-go
    model: deepseek-v4.1-flash
jev:
  mode: enabled
  # provider: laya   # local decision model instead of hosted JEV (default: typesafe)
  usd_per_mtok: 0.042
capability:
  roles:
    specialist:
      pin: gpt-6-astra
