id: slugify-counter-duplicate-slug
prompt: >
  `slugifyWithCounter()` hands out duplicate slugs across repeated calls: slugifying the same title twice returns the same string both times instead of
  a unique second slug. Make the counter produce a distinct slug for every repeated input.
source:
  repo: https://github.com/sindresorhus/slugify
  commit: 2acf5b3cadf7faed3928536d051104502ae2b667
  fix_commit: 6d9750130927ac1ef478d277a53d14244a5d54a1
  pinned_via: "git log -1 --format=%P 6d9750130927ac1ef478d277a53d14244a5d54a1 (blobless clone, 2026-09-19): Fix `slugifyWithCounter()` returning the same slug twice (#82)"
categories:
  - localized-bugs
setup:
  - npm install
golden:
  kind: upstream-test
  files:
    - test.js
  command: "npx ava test.js"
  validated_at: "2026-09-19"
notes: >
  One-file JavaScript library; the upstream fix added the duplicate-slug case to the same test.js the golden runs.
